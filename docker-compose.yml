services:
  db:
    image: postgres:16-alpine
    container_name: open-wealth-db
    environment:
      POSTGRES_USER: openwealth
      POSTGRES_PASSWORD: openwealth
      POSTGRES_DB: openwealth
    ports:
      - "5433:5432"   # host:container
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwealth -d openwealth"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
